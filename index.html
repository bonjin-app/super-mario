<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d1020">
  <meta name="description" content="PIPO JUMP — 오리지널 캐릭터 플랫폼 액션 게임">
  <title>PIPO JUMP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Page chrome carries the reference material so the 320x240 playfield does not
       have to spend pixels on it. Hidden on short viewports, where the canvas needs
       every row it can get. -->
  <div id="shell">
    <header id="topbar">
      <span class="brand">PIPO JUMP</span>
      <span class="sub">오리지널 캐릭터 플랫포머</span>
      <span class="spacer"></span>
      <span class="tip" id="tip">방향키 이동 · <kbd>Space</kbd> 점프 · <kbd>Z</kbd> 달리기 · <kbd>F</kbd> 발사</span>
      <!-- Real status on the right so the bar is not brand-at-far-left plus a
           thousand pixels of nothing. Deliberately shows what the in-game HUD
           does NOT: the saved best score and the audio state. -->
      <span class="status">
        <span id="stHero">HERO PIP</span>
        <span id="stBest">BEST 000000</span>
        <span id="stAudio">SOUND ON · MUSIC ON</span>
      </span>
    </header>

    <!-- #wrap is the measured game box; #stage shrink-wraps the canvas so the
         cabinet frame hugs the playfield instead of enclosing empty space. -->
    <div id="wrap">
      <div id="stage">
        <canvas id="screen" width="320" height="240" aria-label="PIPO JUMP 게임 화면"></canvas>
      </div>
    </div>

    <footer id="botbar">
      <ul id="keys">
        <li><kbd>←</kbd><kbd>→</kbd><b>이동</b></li>
        <li><kbd>Space</kbd><b>점프 <i>길게 누르면 높이</i></b></li>
        <li><kbd>Z</kbd><b>달리기 <i>누른 채 이동</i></b></li>
        <li><kbd>F</kbd><b>발사 <i>꽃 획득 후</i></b></li>
        <li><kbd>P</kbd><b>일시정지 <i>전체 조작 표시</i></b></li>
        <li><kbd>↓</kbd><b>파이프 진입 <i>진입 가능한 파이프 위에서</i></b></li>
        <li><kbd>Q</kbd><b>타이틀로 <i>일시정지 중에만</i></b></li>
        <li><kbd>M</kbd><b>음소거</b></li>
        <li><kbd>B</kbd><b>음악</b></li>
      </ul>
      <p id="powerups">
        <b>파워업</b>
        <span>버섯 — 커진다</span>
        <span>꽃 — <kbd>F</kbd> 로 불꽃 발사</span>
        <span>별 — 무적</span>
        <span>코인 100개 — 1UP</span>
      </p>
    </footer>
  </div>


  <script src="js/engine.js"></script>
</body>
</html>
