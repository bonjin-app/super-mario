<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#17111c">
  <meta name="description" content="PIPO JUMP — 오리지널 캐릭터 플랫폼 액션 게임">
  <title>PIPO JUMP</title>
  <!-- Silkscreen is a real pixel face cut for 8/16px. It carries the control-panel
       labels so the chrome's type and the game's own bitmap type read as one world.
       Latin and numerals only, so Korean copy falls through to the system stack.
       Self-hosted (see the @font-face at the top of style.css) -- the page has no
       third-party requests, so it renders and plays with no network at all. -->
  <link rel="preload" href="fonts/silkscreen-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <!-- The icon is the game's own 'P': the exact 5x7 bitmap from FONT in engine.js,
       painted in the logo's gold gradient. Same letterform on the tab as on the
       title screen. Full-bleed at 16/32 because a tab icon renders at ~16px and any
       padding there costs legibility. -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <!-- The page is a cabinet: a marquee, a screen recessed in its bezel, a control
       panel silkscreened underneath. Structure and material only -- no wood grain,
       no scanlines, no bevels, and no chrome animation. The game moves; the cabinet
       stays still. -->
  <div id="shell">
    <header id="topbar">
      <span class="led" aria-hidden="true"></span>
      <span class="brand">PIPO JUMP</span>
      <span class="sub">오리지널 캐릭터 플랫포머</span>
      <span class="spacer"></span>
      <!-- Machine readout. Deliberately shows what the in-game HUD does NOT: the
           saved best score and the audio state. -->
      <span class="status">
        <span id="stHero">HERO PIP</span>
        <span id="stBest">BEST 000000</span>
        <span id="stAudio">SOUND ON · MUSIC ON</span>
      </span>
    </header>

    <!-- #wrap is the box fit() measures; #stage is the bezel, shrink-wrapped to the
         canvas so the recess hugs the playfield instead of enclosing dead space. -->
    <div id="wrap">
      <div id="stage">
        <canvas id="screen" width="320" height="240" aria-label="PIPO JUMP 게임 화면"></canvas>
      </div>
    </div>

    <footer id="botbar">
      <!-- Play controls, as keycaps grouped by what they do. Generated from the live
           bindings by syncKeyLegend(), so a rebind repaints the panel instead of
           leaving a stale copy of the defaults printed on it. -->
      <div id="keys" class="panel" role="group" aria-label="조작"></div>
      <!-- Machine controls, one weight down: these run the cabinet, not the hero. -->
      <div id="sys" class="sysbar" role="group" aria-label="시스템"></div>
      <p id="powerups">
        <b>파워업</b>
        <span>버섯 — 커진다</span>
        <span>꽃 — <kbd>F</kbd> 로 불꽃 발사</span>
        <span>별 — 무적</span>
        <span>코인 100개 — 1UP</span>
      </p>
    </footer>
  </div>

  <!-- touch pad: shown only on coarse-pointer devices, wired up in engine.js -->
  <div id="pad" hidden>
    <div class="pad-side pad-left">
      <button class="pad-btn" data-key="left"  aria-label="왼쪽">◀</button>
      <button class="pad-btn" data-key="right" aria-label="오른쪽">▶</button>
      <!-- DOWN exists only to enter a pipe, so it sits apart from the d-pad pair -->
      <button class="pad-btn pad-down" data-key="down" aria-label="파이프 진입">▼</button>
    </div>
    <div class="pad-side pad-right">
      <button class="pad-btn" data-key="run"  aria-label="달리기">B</button>
      <button class="pad-btn" data-key="fire" aria-label="화염구">F</button>
      <button class="pad-btn pad-jump" data-key="jump" aria-label="점프">A</button>
    </div>
  </div>
  <script src="js/engine.js"></script>
</body>
</html>
